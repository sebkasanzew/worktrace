[package]
name = "worktrace"
version = "0.4.5"
description = "A minimal desktop app that makes time and work tracking with issue tracking tools, like JIRA, easy."
authors = ["Sebastian Kasanzew"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "worktrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22.1"
gouqi = "0.20"
keyring = { version = "4.0.0", features = ["apple-native", "windows-native"] }
log = "0.4.28"
reqwest = { version = "0.13.0", features = ["json"] }
rust-i18n = "4.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
specta = "2.0.0-rc.22"
specta-typescript = "=0.0.9"
sys-locale = "0.3.2"
tauri = { version = "=2.10.3", features = [] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-fs = "=2.4.5"
tauri-plugin-log = "=2.8.0"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-process = "=2.3.1"
tauri-plugin-store = "=2.4.2"
tauri-plugin-updater = "=2.10.0"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
time = { version = "0.3.41", features = ["parsing", "formatting"] }
url = "2.5.7"

[dev-dependencies]
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
tempfile = "3.20"
