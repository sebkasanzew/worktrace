[package]
name = "worktrace"
version = "0.4.5"
description = "A minimal desktop app that makes time and work tracking with issue tracking tools, like JIRA, easy."
authors = ["Sebastian Kasanzew"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "worktrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
base64 = "=0.23.1"
gouqi = "=0.20.0"
keyring = "=4.2.0"
log = "=0.4.34"
reqwest = { version = "=0.13.5", features = ["json"] }
rust-i18n = "=4.2.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
specta = "=2.0.0-rc.27"
specta-typescript = "=0.0.14"
sys-locale = "=0.3.2"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-store = "=2.5.0"
tauri-plugin-updater = "=2.14.1"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
time = { version = "=0.3.55", features = ["parsing", "formatting"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "=0.6.5"
tempfile = "=3.27.0"
