name: Generate Demo Video

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-demo:
    name: Generate Demo Video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run demo test
        run: xvfb-run --auto-servernum -- pnpm test:e2e:demo

      - name: Move demo video to docs folder
        run: |
          mkdir -p docs
          find test-results/demo-videos -name "video.webm" -exec cp {} docs/demo.webm \;

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update demo video"
          title: "chore: update demo video"
          body: |
            This PR updates the demo video in `docs/demo.webm`.

            Generated automatically by the **Generate Demo Video** workflow.
          branch: chore/update-demo-video
          delete-branch: true
          add-paths: docs/demo.webm
