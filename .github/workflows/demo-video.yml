name: Generate Demo Video

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-demo:
    name: Generate Demo Video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run demo test
        run: xvfb-run --auto-servernum -- pnpm test:e2e:demo

      - name: Convert video to GIF
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p docs
          VIDEO_FILE=$(find test-results/demo-videos -name "video.webm" | head -1)
          ffmpeg -y -i "$VIDEO_FILE" \
            -vf "fps=10,scale=800:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" \
            -loop 0 docs/demo.gif

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch and commit
          git checkout -b chore/update-demo-video
          git add docs/demo.gif
          git commit -m "chore: update demo video"
          git push -f origin chore/update-demo-video

          # Create PR if it doesn't exist, otherwise just update the branch (already pushed)
          if gh pr view chore/update-demo-video --json state -q '.state' 2>/dev/null | grep -q "OPEN"; then
            echo "PR already exists and is open, branch has been updated"
          else
            gh pr create \
              --base main \
              --head chore/update-demo-video \
              --title "chore: update demo video" \
              --body "This PR updates the demo GIF in \`docs/demo.gif\`.

          Generated automatically by the **Generate Demo Video** workflow."
          fi
