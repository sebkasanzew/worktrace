name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.0)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Worktrace ${{ github.ref_name }}
          body: |
            ## What's New

            See the [CHANGELOG](https://github.com/sebkasanzew/worktrace/blob/main/UPDATES.md) for details.

            ## Installation

            - **macOS**: Download the `.dmg` file
            - **Windows**: Download the `.msi` file

            ## Auto-Update

            If you already have Worktrace installed, the app will automatically notify you of this update on next launch.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macOS
            target: aarch64-apple-darwin
            artifact_patterns: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.tar.gz*
          - platform: windows-latest
            os: Windows
            target: x86_64-pc-windows-msvc
            artifact_patterns: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check for signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Error: TAURI_SIGNING_PRIVATE_KEY is not set. The updater artifacts will not be generated."
            exit 1
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is set."
          fi
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build application
        run: pnpm build:all
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List bundle artifacts
        run: ls -R src-tauri/target/release/bundle
        shell: bash

      - name: Generate latest.json
        run: |
          node scripts/generate-latest-json.mts
          # Rename latest.json to include target to avoid collisions
          find src-tauri/target/release/bundle -name "latest.json" -exec mv {} {}-${{ matrix.target }}.json \;
        shell: bash

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_patterns }}
            src-tauri/target/release/bundle/**/latest.json-*.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-manifests:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download partial manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p partials
          gh release download ${{ github.ref_name }} -p "latest.json-*" -D partials

      - name: Merge manifests
        run: |
          node scripts/merge-latest-json.mts partials/*
        shell: bash

      - name: Upload merged latest.json
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [create-release, build-tauri, merge-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Release complete
        run: |
          echo "✅ Release created successfully!"
          echo "🔗 https://github.com/sebkasanzew/worktrace/releases"
