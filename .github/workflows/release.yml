name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.2.0)"
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Worktrace ${{ github.ref_name }}
          body: |
            ## What's New

            See the [CHANGELOG](https://github.com/sebkasanzew/worktrace/blob/main/UPDATES.md) for details.

            ## Installation

            - **macOS**: Download the `.dmg` file
            - **Windows**: Download the `.msi` file

            ## Auto-Update

            If you already have Worktrace installed, the app will automatically notify you of this update on next launch.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macOS
            target: aarch64-apple-darwin
            artifact_patterns: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.tar.gz*
          - platform: windows-latest
            os: Windows
            target: x86_64-pc-windows-msvc
            artifact_patterns: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/zip/*.zip

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Error: TAURI_SIGNING_PRIVATE_KEY is not set. The updater artifacts will not be generated."
            exit 1
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is set."
          fi
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build application
        run: pnpm build:all
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create portable zip (Windows)
        if: matrix.os == 'Windows'
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $zipName = "Worktrace_${version}_x64-portable.zip"
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          $destDir = "src-tauri/target/release/bundle/zip"
          New-Item -ItemType Directory -Force -Path $destDir
          Copy-Item "$releaseDir/worktrace.exe" "$releaseDir/Worktrace.exe"
          Compress-Archive -Path "$releaseDir/Worktrace.exe" -DestinationPath "$destDir/$zipName"
        shell: pwsh

      - name: List bundle artifacts
        run: ls -R src-tauri/target/release/bundle
        shell: bash

      - name: Generate latest.json
        run: |
          node scripts/generate-latest-json.mts
          # Rename latest.json to include target to avoid collisions
          find src-tauri/target/release/bundle -name "latest.json" -exec mv {} {}-${{ matrix.target }}.json \;
        shell: bash

      - name: Generate hashes
        run: |
          node scripts/hash-artifacts.mts
          # Rename hashes.json to include target to avoid collisions
          find src-tauri/target/release/bundle -name "hashes.json" -exec mv {} {}-${{ matrix.target }}.json \;
        shell: bash

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_patterns }}
            src-tauri/target/release/bundle/**/latest.json-*.json
            src-tauri/target/release/bundle/**/hashes.json-*.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-manifests:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download partial manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p partials
          gh release download ${{ github.ref_name }} -p "latest.json-*" -D partials

      - name: Merge manifests
        run: |
          node scripts/merge-latest-json.mts partials/*
        shell: bash

      - name: Upload merged latest.json
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-packages:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p hashes
          gh release download ${{ github.ref_name }} -p "hashes.json-*" -D hashes

      - name: Generate package manifests
        run: |
          node scripts/generate-package-manifests.mts hashes/*
        shell: bash

      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "Skipping Homebrew update: HOMEBREW_TAP_REPO or TAP_GITHUB_TOKEN not set"
            exit 0
          fi

          echo "Updating Homebrew Tap: $HOMEBREW_TAP_REPO"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${GH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git tap
          cd tap
          mkdir -p Casks
          cp ../worktrace.rb Casks/
          git add Casks/worktrace.rb
          git commit -m "Update worktrace to ${{ github.ref_name }}" || echo "No changes to commit"
          git push

      - name: Update Scoop Bucket
        env:
          SCOOP_BUCKET_REPO: ${{ secrets.SCOOP_BUCKET_REPO }}
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$SCOOP_BUCKET_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "Skipping Scoop update: SCOOP_BUCKET_REPO or TAP_GITHUB_TOKEN not set"
            exit 0
          fi

          echo "Updating Scoop Bucket: $SCOOP_BUCKET_REPO"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${GH_TOKEN}@github.com/${SCOOP_BUCKET_REPO}.git bucket
          cd bucket
          cp ../worktrace.json .
          git add worktrace.json
          git commit -m "Update worktrace to ${{ github.ref_name }}" || echo "No changes to commit"
          git push

  finalize-release:
    needs: [create-release, build-tauri, merge-manifests, publish-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Release complete
        run: |
          echo "✅ Release created successfully!"
          echo "🔗 https://github.com/sebkasanzew/worktrace/releases"
