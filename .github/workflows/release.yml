name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.0)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Worktrace ${{ github.ref_name }}
          body: |
            ## What's New

            See the [CHANGELOG](https://github.com/sebkasanzew/worktrace/blob/main/UPDATES.md) for details.

            ## Installation

            - **macOS**: Download the `.dmg` file
            - **Windows**: Download the `.msi` file

            ## Auto-Update

            If you already have Worktrace installed, the app will automatically notify you of this update on next launch.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macOS
            target: aarch64-apple-darwin
            bundles: dmg
            artifact_patterns: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            os: Windows
            target: x86_64-pc-windows-msvc
            bundles: msi
            artifact_patterns: |
              src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build application
        run: pnpm build:all --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List bundle artifacts
        run: ls -R src-tauri/target/release/bundle
        shell: bash

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_patterns }}
            src-tauri/target/release/bundle/**/latest.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Release complete
        run: |
          echo "✅ Release created successfully!"
          echo "🔗 https://github.com/sebkasanzew/worktrace/releases"
